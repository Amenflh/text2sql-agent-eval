[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-agent-eval"
version = "0.1.0"
description = "Self-correcting Text-to-SQL agent with guardrails and an execution-based benchmark, on synthetic banking data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amen Allah FELAH" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Amenflh/text2sql-agent-eval"

[tool.setuptools.packages.find]
include = ["t2s*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731"]
