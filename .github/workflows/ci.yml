name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check t2s tests
      - name: Tests
        run: pytest
      - name: Benchmark (offline backend, no API key)
        run: |
          python -m t2s.data
          python -m t2s.eval --min-accuracy 0.85 --out ci-reports
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: ci-reports/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t text2sql-agent-eval .
      - name: Smoke test the API
        run: |
          docker run -d --name t2s -p 8000:8000 text2sql-agent-eval
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/ask -H 'Content-Type: application/json' \
            -d '{"question": "How many customers live in Sfax?"}' | tee /dev/stderr | grep -q '"status":"answered"'
